# Сборка Windows-приложения через GitHub Actions (с Mac нельзя локально).
#
# Actions → "Build Windows" → Run workflow → скачать artifact forum_app-windows
#
# windows-2022: на windows-latest новый CMake отказывается распаковывать
# libwebrtc через .plugin_symlinks/flutter_webrtc.
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build_windows.yml"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Doctor
        run: flutter doctor -v

      - name: Dependencies
        run: flutter pub get

      - name: Generate Windows build files
        run: flutter build windows --config-only

      - name: Materialize flutter_webrtc (avoid CMake symlink extract)
        shell: pwsh
        run: |
          $link = "windows\flutter\ephemeral\.plugin_symlinks\flutter_webrtc"
          if (-not (Test-Path $link)) {
            Write-Host "No flutter_webrtc symlink (skip)"
            exit 0
          }
          $item = Get-Item $link -Force
          $target = $null
          if ($item.LinkType) {
            $target = $item.Target
            if ($target -is [System.Array]) { $target = $target[0] }
          }
          if (-not $target -or -not (Test-Path $target)) {
            Write-Host "Could not resolve symlink target; leaving as-is"
            exit 0
          }
          Write-Host "Replacing symlink $link -> copy of $target"
          Remove-Item $link -Force -Recurse -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $target -Destination $link -Recurse -Force

      # Не вызываем `flutter build windows --release` после materialize:
      # новый Flutter снова создаёт symlink поверх копии и падает (errno 183).
      # CMake-сборка + install копируют exe/dll/data рядом (как делает flutter build).
      - name: Build Windows release
        shell: pwsh
        run: |
          $cmakeDir = "build\windows\x64"
          if (-not (Test-Path "$cmakeDir\CMakeCache.txt")) {
            throw "CMake cache not found at $cmakeDir (config-only failed?)"
          }
          cmake --build $cmakeDir --config Release --parallel *>&1 |
            Tee-Object -FilePath build_windows.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== LAST 120 LINES OF BUILD LOG ====="
            Get-Content build_windows.log -Tail 120
            exit $LASTEXITCODE
          }
          cmake --install $cmakeDir --config Release *>&1 |
            Tee-Object -FilePath build_windows.log -Append
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== LAST 80 LINES OF BUILD LOG ====="
            Get-Content build_windows.log -Tail 80
            exit $LASTEXITCODE
          }
          $releaseDir = "$cmakeDir\runner\Release"
          foreach ($must in @("forum_app.exe", "flutter_windows.dll", "data\flutter_assets")) {
            if (-not (Test-Path "$releaseDir\$must")) {
              throw "Missing $must in $releaseDir after cmake install"
            }
          }

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build_windows.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package ZIP
        shell: pwsh
        run: |
          $BuildDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$BuildDir\forum_app.exe")) {
            throw "forum_app.exe not found in $BuildDir"
          }

          $Staging = "dist\windows-staging"
          New-Item -ItemType Directory -Force -Path $Staging | Out-Null
          Copy-Item -Path "$BuildDir\*" -Destination $Staging -Recurse -Force

          @"
          @echo off
          chcp 65001 >nul
          setlocal
          set "SRC=%~dp0"
          set "DEST=%LOCALAPPDATA%\Programs\Forum"
          echo Installing Forum to %DEST% ...
          if not exist "%DEST%" mkdir "%DEST%"
          xcopy /E /I /Y /Q "%SRC%*" "%DEST%\" >nul
          powershell -NoProfile -Command "$s=(New-Object -ComObject WScript.Shell).CreateShortcut('%APPDATA%\Microsoft\Windows\Start Menu\Programs\Forum.lnk'); `$s.TargetPath='%DEST%\forum_app.exe'; `$s.WorkingDirectory='%DEST%'; `$s.Save()"
          start "" "%DEST%\forum_app.exe"
          echo Done.
          pause
          "@ | Set-Content -Path "$Staging\install_on_this_pc.bat" -Encoding ASCII

          @"
          Установка Forum на Windows
          ==========================
          1. Распакуйте архив
          2. Запустите install_on_this_pc.bat
             или forum_app.exe

          Flutter и Visual Studio НЕ нужны.
          "@ | Set-Content -Path "$Staging\КАК_УСТАНОВИТЬ.txt" -Encoding UTF8

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path "dist\forum_app-windows.zip") {
            Remove-Item "dist\forum_app-windows.zip" -Force
          }
          Compress-Archive -Path "$Staging\*" -DestinationPath "dist\forum_app-windows.zip" -Force
          Remove-Item $Staging -Recurse -Force
          Write-Host "Created dist\forum_app-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forum_app-windows
          path: dist/forum_app-windows.zip
          if-no-files-found: error
          retention-days: 30
