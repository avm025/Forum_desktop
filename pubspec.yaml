name: forum_app
description: "Forum — a Flutter messenger app (web/desktop two-pane layout)."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  flutter_contacts: ^1.1.9+2
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  image: ^4.5.4
  video_player: ^2.9.2
  just_audio: ^0.9.46
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  qr_flutter: ^4.1.0
  super_drag_and_drop: ^0.9.1
  super_clipboard: ^0.9.1
  livekit_client: ^2.11.0
  flutter_local_notifications: ^22.3.1
  record: ^7.1.2
  camera_macos: ^0.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

# Avoid jni FFI being pulled into Windows desktop builds via path_provider_android 2.3+.
# connectivity_plus 7.1+ uses NWPath.isUltraConstrained (macOS/iOS 26 SDK); Xcode 16 / macOS 15.5 SDK cannot compile it.
# livekit_client 2.11 needs device_info_plus >=12; super_native_extensions 0.9.x declares <12 — override to keep stable 0.9 (no rustup).
dependency_overrides:
  path_provider_android: 2.2.17
  connectivity_plus: 7.0.0
  device_info_plus: 12.4.0
